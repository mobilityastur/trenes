<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trenes en Vivo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trenes">
<meta name="theme-color" content="#14181f">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2314181f'/%3E%3Cpath d='M40 120 Q90 30 140 120' stroke='%23f2a516' stroke-width='12' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='90' cy='68' r='16' fill='%2336c2b4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: mapa a pantalla completa, cartel de estación arriba, filtros y avisos abajo, fichas como hojas deslizantes */
:root{
  --bg:#f3f4f1; --panel:#ffffffef; --fg:#1b2028; --muted:#5d6672; --line:#d9dcd6;
  --ld:#d8890a; --cer:#0f8f83; --ring:#ffffff;
  --late:#c43d32; --warn:#c77700; --ok:#2f8a4c;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14181f; --panel:#1c222bf2; --fg:#eef0f2; --muted:#9aa3ae; --line:#2e3640;
  --ld:#f2a516; --cer:#2fd0c0; --ring:#ffffff;
  --late:#ff6b5e; --warn:#f0a53a; --ok:#5ccf7e; color-scheme:dark;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--body)}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:var(--body)}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}}
button{font-family:var(--body)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ld);outline-offset:2px}
.card{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px #0002}

.top{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top,0px) + 10px);
  left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:stretch}
.brand{flex:1;min-width:0;padding:8px 12px;display:flex;flex-direction:column;justify-content:center}
.brand h1{margin:0;font:700 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.status.err .dot{background:var(--late)}
.iconbtn{width:46px;border:1px solid var(--line);font-size:20px;color:var(--fg);cursor:pointer}

.bottom{position:fixed;z-index:1000;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--fg);font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45}
.chip b{font:600 13px var(--mono)}
.chip.alerts b{color:var(--late)}
.sw{width:12px;height:12px;border:2px solid var(--ring);box-shadow:0 0 0 1px #0003}
.sw.ld{background:var(--ld);border-radius:3px;transform:rotate(45deg)} .sw.cer{background:var(--cer);border-radius:50%}
.search{flex:1 1 100%;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--fg);font:500 15px var(--body)}

.banner{position:fixed;z-index:1001;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);
  width:min(92vw,440px);padding:12px 14px;font-size:13px}
.banner h2{margin:0 0 4px;font:700 17px var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--late)}
.banner p{margin:4px 0}

/* Hojas deslizantes */
.sheet{position:fixed;z-index:1002;left:0;right:0;bottom:0;max-height:78vh;display:flex;flex-direction:column;
  border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;flex:1;font:700 21px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
.close{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer}
.sheet label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.sheet input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:13px var(--mono)}
.primary{margin-top:14px;width:100%;padding:11px;border-radius:10px;border:0;background:var(--ld);color:#14181f;font-weight:600;font-size:15px;cursor:pointer}
.note{color:var(--muted);font-size:12px;margin:10px 0 0}

/* Avisos */
.filterbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filterbar button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.filterbar button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.group{margin:14px 0 6px;font:700 15px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.alert{padding:10px 0;border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0}
.alert p{margin:5px 0 0;max-width:65ch}
.alert time{font-size:11.5px;color:var(--muted)}
.lines{display:flex;gap:4px;flex-wrap:wrap}
.ln{display:inline-block;min-width:26px;text-align:center;padding:1px 6px;border-radius:5px;font:600 12px var(--mono);color:#fff;background:var(--cer)}

/* Marcadores */
.tm{position:relative;width:0;height:0}
.tm .dot{position:absolute;left:0;top:0;transform:translate(-50%,-50%);border:3px solid var(--ring);box-shadow:0 1px 4px #0007}
.tm.cer .dot{width:17px;height:17px;border-radius:50%;background:var(--cer)}
.tm.ld .dot{width:17px;height:17px;border-radius:4px;background:var(--ld);transform:translate(-50%,-50%) rotate(45deg)}
.tm.moving::before{content:"";position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;
  transform:translate(-50%,-50%);background:currentColor;opacity:.28;animation:pulse 2s ease-out infinite}
.tm.cer{color:var(--cer)} .tm.ld{color:var(--ld)}
.tm.stopped .dot{width:13px;height:13px;border-width:2px;opacity:.85}
.tm.hit .dot{outline:3px solid var(--fg);outline-offset:2px}
.tm .late{position:absolute;left:9px;top:-22px;padding:0 5px;border-radius:5px;font:600 11px/17px var(--mono);
  color:#fff;background:var(--warn);white-space:nowrap;box-shadow:0 1px 3px #0005}
.tm .late.bad{background:var(--late)}
.zoomed-out .tm .late{display:none}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.45);opacity:.45}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}}

/* Ficha del tren */
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg)}
.leaflet-popup-content{margin:12px 14px}
.pop .kind{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pop .num{font:700 24px/1.1 var(--display);letter-spacing:.03em;margin-top:4px}
.pop .route{font-weight:600;font-size:14px;margin:4px 0 2px}
.pop .route span{color:var(--muted);font-weight:400}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0;font-size:12.5px}
.pop dt{color:var(--muted)} .pop dd{margin:0}
.badge{display:inline-block;padding:0 6px;border-radius:5px;font:600 12px/18px var(--mono);color:#fff;background:var(--ok)}
.badge.warn{background:var(--warn)} .badge.bad{background:var(--late)}
.pop .alink{margin-top:8px;width:100%;border:1px solid var(--late);color:var(--late);background:transparent;border-radius:8px;padding:6px;font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){.tm.moving::before{animation:none;opacity:.25}}
</style>
</head>
<body>
<div id="map" aria-label="Mapa de trenes"></div>

<div class="top">
  <div class="card brand">
    <h1>Trenes en vivo</h1>
    <div class="status" id="status"><span class="dot"></span>Conectando con Renfe…</div>
  </div>
  <button class="card iconbtn" id="locate" title="Mi ubicación" aria-label="Centrar en mi ubicación">◎</button>
  <button class="card iconbtn" id="settingsBtn" title="Ajustes" aria-label="Ajustes">⚙︎</button>
</div>

<div class="card banner" id="banner" hidden>
  <h2>Renfe no deja leer sus datos</h2>
  <p>El navegador ha bloqueado la conexión directa. Configura un intermediario en Ajustes (⚙︎) para que la app funcione.</p>
</div>

<div class="card bottom">
  <button class="chip" id="fLd" aria-pressed="true"><span class="sw ld"></span>Larga y media <b id="nLd">–</b></button>
  <button class="chip" id="fCer" aria-pressed="true"><span class="sw cer"></span>Cercanías <b id="nCer">–</b></button>
  <button class="chip alerts" id="alertsBtn">⚠︎ Avisos <b id="nAl">–</b></button>
  <input class="search" id="q" type="search" placeholder="Tren, línea o destino (12484, C4, Cádiz…)" aria-label="Buscar tren, línea o destino" autocomplete="off">
</div>

<div class="card sheet" id="alertsSheet" hidden>
  <div class="sheet-head"><h2>Avisos de Cercanías</h2><button class="close" data-close>Cerrar</button></div>
  <div class="sheet-body">
    <div class="filterbar" id="nucleos"></div>
    <div id="alertsList"></div>
  </div>
</div>

<div class="card sheet" id="settingsSheet" hidden>
  <div class="sheet-head"><h2>Ajustes</h2><button class="close" data-close>Cerrar</button></div>
  <div class="sheet-body">
    <label for="proxy">Dirección del intermediario</label>
    <input id="proxy" placeholder="https://trenes.tu-nombre.workers.dev/?url=" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="primary" id="save">Guardar</button>
    <p class="note" id="datosInfo"></p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const R = 'https://gtfsrt.renfe.com/';
const FEEDS = {
  posLd:  R+'vehicle_positions_LD.json',
  posCer: R+'vehicle_positions.json',
  tuLd:   R+'trip_updates_LD.json',
  tuCer:  R+'trip_updates.json',
  alerts: R+'alerts.json'
};
const REFRESH_MS = 20000;
const NUCLEOS = {'10':'Madrid','20':'Asturias','30':'Sevilla','31':'Cádiz','32':'Málaga','40':'Valencia',
  '41':'Murcia/Alicante','50':'Rodalies Catalunya','51':'Rodalies Catalunya','60':'Bilbao','61':'San Sebastián',
  '62':'Santander','70':'Zaragoza'};

const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let proxy = store.get('proxy') || '';
const show = {ld: store.get('show_ld') !== '0', cer: store.get('show_cer') !== '0'};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = t => new Date(t*1000).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});

/* ---------- Mapa ---------- */
const map = L.map('map', {zoomControl:false}).setView([40.2,-3.7], 6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18,
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Datos: Renfe (CC BY 4.0)'}).addTo(map);
const layers = {ld:L.layerGroup().addTo(map), cer:L.layerGroup().addTo(map)};
const markers = {ld:new Map(), cer:new Map()};
const syncZoom = () => $('map').classList.toggle('zoomed-out', map.getZoom() < 9);
map.on('zoomend', syncZoom); syncZoom();

/* ---------- Datos estáticos (los genera la Action de GitHub cada noche) ---------- */
let ST = {}, VJ = null;
fetch('datos/estaciones.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{}).then(j=>{ST=j||{}}).catch(()=>{});
fetch('datos/viajes.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{VJ=j; refreshMarkersOnly();}).catch(()=>{});
const stName = id => id ? (ST[id] || ('Estación '+id)) : '—';

/* ---------- Estado en vivo ---------- */
const delays = new Map();       // tripId -> {delay, cancelled}
let alerts = [];                 // [{id, text, start, routes:[], nucleos:Set}]
const entityOf = new Map();      // marker -> datos

function trainNumber(e, key){
  const v = e.vehicle || {};
  const label = v.vehicle?.label || v.vehicle?.id || '';
  const trip = v.trip?.tripId || '';
  if (key === 'ld') return (label || trip.slice(0,5)).replace(/^0+/, '') || '?';
  const m = trip.match(/^\d+[A-Z](\d{3,6})/) || label.match(/(\d{4,6})/);
  return m ? m[1].replace(/^0+/, '') : (label || trip || '?');
}
function tripInfo(e, key){
  if (!VJ) return null;
  const tid = e.vehicle?.trip?.tripId || '';
  let row = key === 'ld' ? VJ.ld[trainNumber(e,'ld')] : (VJ.cer[tid] || VJ.cerNum[tid.slice(0,2)+'|'+trainNumber(e,'cer')]);
  if (!row) return null;
  const [ri, o, d, sign] = row, ruta = VJ.rutas[ri] || ['', '', ''];
  return {line: ruta[0] || ruta[1], longName: ruta[1], color: ruta[2], routeIdx: ri, origin: o, dest: d, sign};
}
function lineFromTrip(e){ const m = (e.vehicle?.trip?.tripId||'').match(/(C\d+[a-z]?|R\d+[a-z]?|T\d+)$/i); return m ? m[1].toUpperCase() : ''; }
function delayOf(e){ return delays.get(e.vehicle?.trip?.tripId || ''); }
function routeAlerts(info, e){
  if (!alerts.length) return [];
  const tid = e.vehicle?.trip?.tripId || '';
  return alerts.filter(a => a.trips.includes(tid) ||
    (info && a.routes.some(r => VJ?.rutaId?.[r] === info.routeIdx)));
}

/* ---------- Marcadores ---------- */
function icon(key, e, hit){
  const stopped = e.vehicle.currentStatus === 'STOPPED_AT';
  const d = delayOf(e), mins = d ? Math.round(d.delay/60) : 0;
  const late = mins >= 3 ? `<span class="late${mins>=15?' bad':''}">+${mins}′</span>` : '';
  return L.divIcon({className:'', iconSize:[0,0],
    html:`<div class="tm ${key} ${stopped?'stopped':'moving'}${hit?' hit':''}"><div class="dot"></div>${late}</div>`});
}
function matches(e, key, q){
  if (!q) return false;
  const info = tripInfo(e, key);
  const hay = [trainNumber(e,key), info?.line, lineFromTrip(e), stName(info?.dest), stName(info?.origin), info?.sign]
    .filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
function render(key, data){
  const q = $('q').value.trim(), seen = new Set();
  for (const e of data.entity || []){
    const p = e.vehicle?.position; if (!p || !p.latitude) continue;
    seen.add(e.id);
    let m = markers[key].get(e.id);
    if (!m){
      m = L.marker([p.latitude,p.longitude], {icon:icon(key,e,matches(e,key,q))});
      m.bindPopup(() => popupHtml(entityOf.get(m), key), {maxWidth:290, minWidth:230, autoPanPaddingTopLeft:[10,100], autoPanPaddingBottomRight:[10,190]});
      markers[key].set(e.id, m); layers[key].addLayer(m);
    } else {
      m.setLatLng([p.latitude,p.longitude]);
    }
    entityOf.set(m, e);
  }
  for (const [id,m] of markers[key]) if (!seen.has(id)){ layers[key].removeLayer(m); markers[key].delete(id); entityOf.delete(m); }
  $(key==='ld'?'nLd':'nCer').textContent = seen.size;
}
function refreshMarkersOnly(){
  const q = $('q').value.trim();
  for (const k of ['ld','cer']) for (const m of markers[k].values()){
    const e = entityOf.get(m); m.setIcon(icon(k, e, matches(e,k,q)));
    if (m.isPopupOpen()) m.getPopup().setContent(popupHtml(e,k));
  }
}

/* ---------- Ficha ---------- */
const STATUS_TXT = {STOPPED_AT:'Parado en', IN_TRANSIT_TO:'En marcha hacia', INCOMING_AT:'Llegando a'};
function popupHtml(e, key){
  const v = e.vehicle, info = tripInfo(e, key), d = delayOf(e);
  const line = info?.line || (key==='cer' ? lineFromTrip(e) : '');
  const color = info?.color ? '#'+info.color.replace('#','') : null;
  const kind = key==='ld' ? (line || 'Larga / media distancia') : 'Cercanías';
  const chip = key==='cer' && line ? `<span class="ln"${color?` style="background:${esc(color)}"`:''}>${esc(line)}</span>` : '';
  let route = '';
  if (info?.origin || info?.dest) route = `<div class="route">${esc(stName(info.origin))} <span>→</span> ${esc(info.sign && key==='cer' ? info.sign : stName(info.dest))}</div>`;
  else if (info?.longName) route = `<div class="route">${esc(info.longName)}</div>`;
  let delay = '<span style="color:var(--muted)">Sin datos</span>';
  if (d){
    const mins = Math.round(d.delay/60);
    delay = d.cancelled ? '<span class="badge bad">Cancelado</span>'
      : mins <= 0 ? '<span class="badge">Puntual</span>'
      : `<span class="badge ${mins>=15?'bad':mins>=5?'warn':''}">+${mins} min</span>`;
  }
  const al = key==='cer' ? routeAlerts(info, e) : [];
  const alBtn = al.length ? `<button class="alink" onclick="openAlerts(${esc(JSON.stringify(al.map(a=>a.id)))})">⚠︎ ${al.length} aviso${al.length>1?'s':''} en esta línea</button>` : '';
  return `<div class="pop">
    <div class="kind">${chip}${esc(kind)}</div>
    <div class="num">Tren ${esc(trainNumber(e,key))}</div>
    ${route}
    <dl>
      <dt>Estado</dt><dd>${esc(STATUS_TXT[v.currentStatus] || 'Cerca de')} ${esc(stName(v.stopId))}</dd>
      <dt>Retraso</dt><dd>${delay}</dd>
      ${v.timestamp ? `<dt>Posición</dt><dd>${hhmm(+v.timestamp)}</dd>` : ''}
    </dl>${alBtn}</div>`;
}

/* ---------- Avisos ---------- */
function nucleoOf(routeId){ return NUCLEOS[String(routeId).slice(0,2)] || 'Otros'; }
function parseAlerts(data){
  return (data.entity || []).filter(x => x.alert).map(x => {
    const a = x.alert, ie = a.informedEntity || [];
    const tr = (a.descriptionText?.translation || a.headerText?.translation || []);
    const text = (tr.find(t => (t.language||'es').startsWith('es')) || tr[0] || {}).text || '';
    const routes = [...new Set(ie.map(i => i.routeId).filter(Boolean))];
    const trips = ie.map(i => i.trip?.tripId).filter(Boolean);
    const nucleos = new Set(routes.map(nucleoOf));
    if (!nucleos.size) nucleos.add('Otros');
    return {id:x.id, text, start:+(a.activePeriod?.[0]?.start || 0), routes, trips, nucleos};
  }).filter(a => a.text).sort((a,b) => b.start - a.start);
}
function lineChips(a){
  const names = new Map();
  for (const r of a.routes){
    const ri = VJ?.rutaId?.[r], ruta = ri != null ? VJ.rutas[ri] : null;
    const name = ruta?.[0] || (String(r).match(/(C\d+[a-z]?|R\d+[a-z]?|T\d+)$/i)||[])[1];
    if (name && !names.has(name.toUpperCase())) names.set(name.toUpperCase(), ruta?.[2] ? '#'+ruta[2] : null);
  }
  return [...names].sort().map(([n,c]) => `<span class="ln"${c?` style="background:${esc(c)}"`:''}>${esc(n)}</span>`).join('');
}
let alertFilter = null, alertOnly = null;
function renderAlerts(){
  const counts = {};
  alerts.forEach(a => a.nucleos.forEach(n => counts[n] = (counts[n]||0)+1));
  const names = Object.keys(counts).sort((a,b) => (a==='Otros')-(b==='Otros') || a.localeCompare(b,'es'));
  $('nucleos').innerHTML = alertOnly ? `<button aria-pressed="true" data-n="">Esta línea · ver todos</button>`
    : `<button aria-pressed="${!alertFilter}" data-n="">Todos ${alerts.length}</button>` +
      names.map(n => `<button aria-pressed="${alertFilter===n}" data-n="${esc(n)}">${esc(n)} ${counts[n]}</button>`).join('');
  const list = alerts.filter(a => alertOnly ? alertOnly.includes(a.id) : (!alertFilter || a.nucleos.has(alertFilter)));
  const groups = {};
  list.forEach(a => { const g = [...a.nucleos][0]; (groups[g] ||= []).push(a); });
  $('alertsList').innerHTML = list.length ? Object.keys(groups).sort((a,b)=>(a==='Otros')-(b==='Otros')||a.localeCompare(b,'es')).map(g =>
    `<div class="group">${esc(g)}</div>` + groups[g].map(a => `<div class="alert">
      <div class="lines">${lineChips(a)}</div>
      <p>${esc(a.text)}</p>
      ${a.start ? `<time>Desde ${new Date(a.start*1000).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</time>` : ''}
    </div>`).join('')).join('') : '<p class="note">No hay avisos ahora mismo.</p>';
}
$('nucleos').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  alertOnly = null; alertFilter = b.dataset.n || null; renderAlerts();
});
window.openAlerts = ids => { alertOnly = ids; alertFilter = null; renderAlerts(); map.closePopup(); openSheet('alertsSheet'); };
$('alertsBtn').onclick = () => { alertOnly = null; renderAlerts(); openSheet('alertsSheet'); };

/* ---------- Red ---------- */
async function getJson(url){
  const r = await fetch(proxy ? proxy + encodeURIComponent(url) : url, {cache:'no-store'});
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function loadDelays(data){
  for (const x of data.entity || []){
    const tu = x.tripUpdate; if (!tu?.trip?.tripId) continue;
    const delay = tu.delay ?? tu.stopTimeUpdate?.[0]?.arrival?.delay ?? tu.stopTimeUpdate?.[0]?.departure?.delay ?? 0;
    delays.set(tu.trip.tripId, {delay:+delay, cancelled: tu.trip.scheduleRelationship === 'CANCELED' || /^TUCANCEL/.test(x.id)});
  }
}
let tick = 0;
async function refresh(){
  const withAlerts = tick++ % 3 === 0;
  const keys = ['posLd','posCer','tuLd','tuCer', ...(withAlerts ? ['alerts'] : [])];
  const res = await Promise.allSettled(keys.map(k => getJson(FEEDS[k])));
  const got = Object.fromEntries(keys.map((k,i) => [k, res[i].status==='fulfilled' ? res[i].value : null]));
  if (got.tuLd || got.tuCer){ delays.clear(); got.tuLd && loadDelays(got.tuLd); got.tuCer && loadDelays(got.tuCer); }
  if (got.alerts){ alerts = parseAlerts(got.alerts); $('nAl').textContent = alerts.length; if (!$('alertsSheet').hidden) renderAlerts(); }
  if (got.posLd) render('ld', got.posLd);
  if (got.posCer) render('cer', got.posCer);
  refreshMarkersOnly();

  const ok = !!(got.posLd || got.posCer), st = $('status');
  const now = new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const total = markers.ld.size + markers.cer.size;
  st.className = 'status' + (ok ? '' : ' err');
  st.innerHTML = '<span class="dot"></span>' + (!ok ? 'Sin conexión con Renfe · reintento en 20 s'
    : total === 0 ? `Ningún tren circulando ahora · ${now}` : `Actualizado ${now}`);
  $('banner').hidden = ok || !!proxy;
}

/* ---------- Controles ---------- */
function applyFilters(){
  for (const k of ['ld','cer']){
    $(k==='ld'?'fLd':'fCer').setAttribute('aria-pressed', show[k]);
    show[k] ? map.addLayer(layers[k]) : map.removeLayer(layers[k]);
  }
}
$('fLd').onclick = () => { show.ld = !show.ld; store.set('show_ld', show.ld?'1':'0'); applyFilters(); };
$('fCer').onclick = () => { show.cer = !show.cer; store.set('show_cer', show.cer?'1':'0'); applyFilters(); };
let searchT;
$('q').addEventListener('input', () => {
  clearTimeout(searchT);
  searchT = setTimeout(() => {
    refreshMarkersOnly();
    const q = $('q').value.trim(); if (q.length < 2) return;
    const hits = [];
    for (const k of ['ld','cer']) if (show[k]) for (const m of markers[k].values()) if (matches(entityOf.get(m),k,q)) hits.push(m);
    if (hits.length === 1){ map.setView(hits[0].getLatLng(), Math.max(map.getZoom(), 11)); hits[0].openPopup(); }
    else if (hits.length > 1) map.fitBounds(L.latLngBounds(hits.map(m => m.getLatLng())).pad(.2), {maxZoom:12});
  }, 350);
});
$('locate').onclick = () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    map.setView([p.coords.latitude, p.coords.longitude], 11);
    L.circleMarker([p.coords.latitude, p.coords.longitude], {radius:7, color:'#3b82f6', fillOpacity:.9}).addTo(map);
  });
};
function openSheet(id){ document.querySelectorAll('.sheet').forEach(s => s.hidden = s.id !== id); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.sheet').hidden = true);
$('settingsBtn').onclick = () => {
  $('proxy').value = proxy;
  $('datosInfo').textContent = VJ ? `Nombres de estaciones y recorridos actualizados el ${new Date(VJ.generado).toLocaleString('es-ES',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}.`
    : 'Aún no hay nombres de estaciones ni recorridos: falta ejecutar la tarea «Actualizar datos de Renfe» en GitHub.';
  openSheet('settingsSheet');
};
$('save').onclick = () => { proxy = $('proxy').value.trim(); store.set('proxy', proxy); $('settingsSheet').hidden = true; tick = 0; refresh(); };

applyFilters();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
