<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trenes en Vivo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trenes">
<meta name="theme-color" content="#14181f">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2314181f'/%3E%3Cpath d='M40 120 Q90 30 140 120' stroke='%23f2a516' stroke-width='12' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='90' cy='68' r='16' fill='%2336c2b4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mapa a pantalla completa, panel flotante tipo cartel de estación arriba, barra de filtros abajo */
:root{
  --bg:#f3f4f1; --panel:#ffffffee; --fg:#1b2028; --muted:#5d6672; --line:#d9dcd6;
  --ld:#d8890a;      /* Alta Velocidad / Larga / Media Distancia: ámbar de cartel */
  --cer:#1f9e91;     /* Cercanías */
  --stop:#8a93a0; --danger:#c43d32;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14181f; --panel:#1c222bee; --fg:#eef0f2; --muted:#9aa3ae; --line:#2e3640;
  --ld:#f2a516; --cer:#36c2b4; --stop:#6f7884; --danger:#ef6a5e; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--body)}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:var(--body)}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}}
.top{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top,0px) + 10px);
  left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:stretch;pointer-events:none}
.card{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px #0002;pointer-events:auto}
.brand{flex:1;min-width:0;padding:8px 12px;display:flex;flex-direction:column;justify-content:center}
.brand h1{margin:0;font:700 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cer);margin-right:5px;vertical-align:1px}
.status.err .dot{background:var(--danger)}
.iconbtn{width:46px;border:0;font:600 20px var(--body);color:var(--fg);cursor:pointer}
.iconbtn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ld);outline-offset:2px}
.bottom{position:fixed;z-index:1000;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--fg);font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45}
.chip .sw{width:10px;height:10px;border-radius:50%}
.chip b{font:500 13px var(--mono)}
.search{flex:1;min-width:120px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--fg);font:500 15px var(--mono)}
.banner{position:fixed;z-index:1001;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);
  width:min(92vw,440px);padding:12px 14px;font-size:13px}
.banner h2{margin:0 0 4px;font:700 17px var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--danger)}
.banner p{margin:4px 0}
.sheet{position:fixed;z-index:1002;inset:auto 0 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));
  border-radius:18px 18px 0 0}
.sheet h2{margin:0 0 6px;font:700 20px var(--display);text-transform:uppercase;letter-spacing:.04em}
.sheet label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.sheet input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:13px var(--mono)}
.sheet .row{display:flex;gap:8px;margin-top:14px}
.sheet .row button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 14px var(--body);cursor:pointer}
.sheet .row button.primary{background:var(--ld);border-color:var(--ld);color:#14181f}
.sheet small{color:var(--muted)}
/* Marcadores */
.tr{width:14px;height:14px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px #0004}
.tr.ld{background:var(--ld)} .tr.cer{background:var(--cer);width:11px;height:11px}
.tr.stopped{outline:2px solid var(--stop);outline-offset:1px}
.tr.hit{transform:scale(1.8);box-shadow:0 0 0 4px #fff8}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg)}
.pop .num{font:700 26px/1 var(--display);letter-spacing:.03em}
.pop .kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:12.5px}
.pop dt{color:var(--muted)} .pop dd{margin:0;font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Mapa de trenes"></div>

<div class="top">
  <div class="card brand">
    <h1>Trenes en vivo</h1>
    <div class="status" id="status"><span class="dot"></span>Conectando con Renfe…</div>
  </div>
  <button class="card iconbtn" id="locate" title="Mi ubicación" aria-label="Centrar en mi ubicación">◎</button>
  <button class="card iconbtn" id="settingsBtn" title="Ajustes" aria-label="Ajustes">⚙︎</button>
</div>

<div class="card banner" id="banner" hidden>
  <h2>Renfe no deja leer sus datos</h2>
  <p>El navegador ha bloqueado la conexión directa. Configura un intermediario en Ajustes (⚙︎) para que la app funcione.</p>
</div>

<div class="card bottom">
  <button class="chip" id="fLd" aria-pressed="true"><span class="sw" style="background:var(--ld)"></span>Larga y media <b id="nLd">–</b></button>
  <button class="chip" id="fCer" aria-pressed="true"><span class="sw" style="background:var(--cer)"></span>Cercanías <b id="nCer">–</b></button>
  <input class="search" id="q" inputmode="numeric" placeholder="Nº de tren" aria-label="Buscar número de tren">
</div>

<div class="card sheet" id="sheet" hidden>
  <h2>Ajustes</h2>
  <small>Solo hace falta si Renfe bloquea la conexión directa.</small>
  <label for="proxy">Dirección del intermediario</label>
  <input id="proxy" placeholder="https://trenes.tu-nombre.workers.dev/?url=" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="row">
    <button id="cancel">Cerrar</button>
    <button class="primary" id="save">Guardar</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const FEEDS = [
  {key:'ld',  name:'Larga y media distancia', url:'https://gtfsrt.renfe.com/vehicle_positions_LD.json'},
  {key:'cer', name:'Cercanías',               url:'https://gtfsrt.renfe.com/vehicle_positions.json'}
];
const REFRESH_MS = 20000;
const STATUS_TXT = {STOPPED_AT:'Parado en estación', IN_TRANSIT_TO:'En marcha', INCOMING_AT:'Llegando'};

const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let proxy = store.get('proxy') || '';
const show = {ld: store.get('show_ld') !== '0', cer: store.get('show_cer') !== '0'};

const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const map = L.map('map', {zoomControl:false, attributionControl:true, preferCanvas:false}).setView([40.2,-3.7], 6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:18,
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Datos: Renfe (CC BY 4.0)'
}).addTo(map);

const layers = {ld: L.layerGroup().addTo(map), cer: L.layerGroup().addTo(map)};
const markers = {ld:new Map(), cer:new Map()};
const $ = id => document.getElementById(id);

function trainNumber(e, key){
  const v = e.vehicle || {};
  const label = v.vehicle?.label || v.vehicle?.id || '';
  const trip = v.trip?.tripId || '';
  if (key === 'ld') return (label || trip.slice(0,5)).replace(/^0+/, '') || '?';
  const m = label.match(/(\d{4,6})/) || trip.match(/(\d{4,6})/);
  return m ? m[1] : (label || trip || '?');
}
function lineName(e, key){
  if (key === 'ld') return '';
  const label = e.vehicle?.vehicle?.label || '';
  const m = label.match(/^([A-Z]{1,3}\d{0,2}[a-z]?)[-\s]/);
  return m ? m[1] : (e.vehicle?.trip?.routeId || '');
}
function popupHtml(e, key){
  const v = e.vehicle;
  const num = trainNumber(e, key), line = lineName(e, key);
  const ts = v.timestamp ? new Date(+v.timestamp*1000).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : '—';
  return `<div class="pop"><div class="kind">${key==='ld'?'Alta Velocidad · Larga · Media':'Cercanías'}${line?' · '+line:''}</div>
  <div class="num">Tren ${num}</div>
  <dl><dt>Estado</dt><dd>${STATUS_TXT[v.currentStatus]||v.currentStatus||'—'}</dd>
  <dt>Estación</dt><dd>${v.stopId||'—'}</dd>
  <dt>Viaje</dt><dd>${v.trip?.tripId||'—'}</dd>
  <dt>Posición</dt><dd>${v.timestamp?ts:'—'}</dd></dl></div>`;
}
function icon(key, stopped, hit){
  return L.divIcon({className:'', iconSize:[16,16], html:`<div class="tr ${key}${stopped?' stopped':''}${hit?' hit':''}"></div>`});
}

async function getJson(url){
  const attempts = proxy ? [proxy + encodeURIComponent(url)] : [url];
  if (!proxy) {/* solo directo */}
  let lastErr;
  for (const u of attempts){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(err){ lastErr = err; }
  }
  throw lastErr;
}

function render(key, data){
  const q = $('q').value.trim();
  const seen = new Set();
  for (const e of data.entity || []){
    const p = e.vehicle?.position; if (!p || !p.latitude) continue;
    const id = e.id; seen.add(id);
    const stopped = e.vehicle.currentStatus === 'STOPPED_AT';
    const hit = q && trainNumber(e,key).includes(q);
    let m = markers[key].get(id);
    if (!m){ m = L.marker([p.latitude,p.longitude], {icon:icon(key,stopped,hit)}).bindPopup(''); markers[key].set(id,m); layers[key].addLayer(m); }
    else { m.setLatLng([p.latitude,p.longitude]); m.setIcon(icon(key,stopped,hit)); }
    m._entity = e; m.setPopupContent(popupHtml(e,key));
  }
  for (const [id,m] of markers[key]) if (!seen.has(id)){ layers[key].removeLayer(m); markers[key].delete(id); }
  $(key==='ld'?'nLd':'nCer').textContent = seen.size;
}

let failing = false;
async function refresh(){
  const results = await Promise.allSettled(FEEDS.map(f => getJson(f.url)));
  let ok = 0, errs = [];
  results.forEach((r,i) => { if (r.status==='fulfilled'){ ok++; render(FEEDS[i].key, r.value); } else errs.push(FEEDS[i].name); });
  const st = $('status');
  const now = new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if (ok){ st.className='status'+(errs.length?' err':''); st.innerHTML = `<span class="dot"></span>Actualizado ${now}${errs.length?' · sin '+errs.join(', '):''}`; }
  else { st.className='status err'; st.innerHTML = `<span class="dot"></span>Sin conexión con Renfe · reintento en 20 s`; }
  $('banner').hidden = ok > 0 || !!proxy;
}

function applyFilters(){
  for (const k of ['ld','cer']){
    $(k==='ld'?'fLd':'fCer').setAttribute('aria-pressed', show[k]);
    show[k] ? map.addLayer(layers[k]) : map.removeLayer(layers[k]);
  }
}
$('fLd').onclick = () => { show.ld = !show.ld; store.set('show_ld', show.ld?'1':'0'); applyFilters(); };
$('fCer').onclick = () => { show.cer = !show.cer; store.set('show_cer', show.cer?'1':'0'); applyFilters(); };
$('q').addEventListener('input', () => {
  const q = $('q').value.trim(); let first;
  for (const k of ['ld','cer']) for (const m of markers[k].values()){
    const e = m._entity, hit = q && trainNumber(e,k).includes(q);
    m.setIcon(icon(k, e.vehicle.currentStatus==='STOPPED_AT', hit));
    if (hit && !first && show[k]) first = m;
  }
  if (first && q.length >= 3){ map.setView(first.getLatLng(), Math.max(map.getZoom(), 10)); first.openPopup(); }
});
$('locate').onclick = () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    map.setView([p.coords.latitude, p.coords.longitude], 11);
    L.circleMarker([p.coords.latitude, p.coords.longitude], {radius:7, color:'#3b82f6', fillOpacity:.9}).addTo(map);
  });
};
$('settingsBtn').onclick = () => { $('proxy').value = proxy; $('sheet').hidden = false; };
$('cancel').onclick = () => { $('sheet').hidden = true; };
$('save').onclick = () => { proxy = $('proxy').value.trim(); store.set('proxy', proxy); $('sheet').hidden = true; refresh(); };

applyFilters();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
